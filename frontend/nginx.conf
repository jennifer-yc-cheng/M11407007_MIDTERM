server {
    listen 80;
    server_name _;

    # Docker 內建 DNS：讓 Nginx 在執行時才解析 branch-xxx 容器名稱，
    # 因此新增分店時不需要修改這份設定
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;

    # 總部內部 API 只給分店服務在 Docker 網路內呼叫，不對外開放
    location ^~ /api/hq/internal/ {
        return 403;
    }

    # /api/hq/xxx  ->  hq-api:3000/api/xxx
    location ~ ^/api/hq/(.*)$ {
        set $hq_path $1;
        proxy_pass http://hq-api:3000/api/$hq_path$is_args$args;
    }

    # /api/branch/<code>/xxx  ->  branch-<code>:3000/api/xxx
    location ~ ^/api/branch/([a-z0-9-]+)/(.*)$ {
        set $branch_code $1;
        set $branch_path $2;
        proxy_pass http://branch-$branch_code:3000/api/$branch_path$is_args$args;
    }

    location /api/ {
        return 404;
    }

    # Vue Router（history mode）：所有頁面都回傳 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
